<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Il Mio Profilo - Cliente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light vh-100 d-flex flex-column overflow-hidden">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm flex-shrink-0">
        <div class="container-fluid px-4 d-flex justify-content-between align-items-center">
            <div class="d-flex align-items-center">
                <a class="navbar-brand fw-bold" href="index.html">← Torna alla Home</a>
            </div>
            <button class="btn btn-danger" onclick="logout()">Esci</button>
        </div>
    </nav>

    <div class="container-fluid px-4 mt-4 flex-grow-1 d-flex flex-column overflow-hidden">
        <div class="row h-100 pb-4">
            
            <div class="col-md-4 h-100 d-flex flex-column mb-3 mb-md-0">
                <div class="bg-white p-4 rounded-3 shadow-sm d-flex flex-column h-100 position-relative">
                    <h4 class="text-primary fw-bold mb-3 border-bottom pb-2" id="displayEmail">I Miei Dati</h4>
                    
                    <div class="flex-grow-1 d-flex flex-column overflow-y-auto pe-2">
                        <form id="profileForm" class="d-flex flex-column h-100">
                            <div class="row g-3 mb-3">
                                <div class="col-6">
                                    <label class="form-label small text-muted mb-0">Nome</label>
                                    <input type="text" id="profNome" class="form-control">
                                </div>
                                <div class="col-6">
                                    <label class="form-label small text-muted mb-0">Cognome</label>
                                    <input type="text" id="profCognome" class="form-control">
                                </div>
                            </div>
                            
                            <div class="row g-3 mb-3">
                                <div class="col-6">
                                    <label class="form-label small text-muted mb-0">Nome Utente</label>
                                    <input type="text" id="profUsername" class="form-control">
                                </div>
                                <div class="col-6">
                                    <label class="form-label small text-muted mb-0">Nuova Password</label>
                                    <input type="password" id="profPassword" class="form-control" placeholder="Vuoto per non cambiare">
                                </div>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label small text-muted mb-0">Indirizzo di spedizione</label>
                                <input type="text" id="profIndirizzo" class="form-control">
                            </div>
                            <div class="row g-3 mb-3">
                                <div class="col-6">
                                    <label class="form-label small text-muted mb-0">Pagamento Preferito</label>
                                    <select class="form-select" id="profPagamento">
                                        <option value="carta_credito">Carta di Credito</option>
                                        <option value="prepagata">Carta Prepagata</option>
                                    </select>
                                </div>
                                <div class="col-6">
                                    <label class="form-label small text-muted mb-0">Preferenze</label>
                                    <input type="text" id="profPreferenze" class="form-control" placeholder="Es. Fritto, Dolce...">
                                </div>
                            </div>

                            <div class="mt-2 mb-4 p-3 bg-light border rounded">
                                <h6 class="text-primary fw-bold mb-3">Carta Salvata</h6>
                                <div class="mb-2">
                                    <input type="text" class="form-control form-control-sm" id="profNumCarta" placeholder="Numero Carta (16 cifre)" pattern="\d{16}" title="Inserisci esattamente 16 numeri">
                                </div>
                                <div class="row g-2">
                                    <div class="col-6">
                                        <input type="text" class="form-control form-control-sm" id="profScadCarta" placeholder="Scadenza (MM/AA)" pattern="(0[1-9]|1[0-2])\/[0-9]{2}" title="Inserisci una data valida nel formato MM/AA">
                                    </div>
                                    <div class="col-6">
                                        <input type="text" class="form-control form-control-sm" id="profCvvCarta" placeholder="CVV (3 cifre)" pattern="\d{3}" title="Inserisci il codice a 3 cifre sul retro">
                                    </div>
                                </div>
                            </div>

                            <div class="mt-auto pt-3 border-top">
                                <button type="submit" class="btn btn-primary w-100 fw-bold mb-2 py-2">Salva Modifiche</button>
                                <div class="text-center">
                                    <button type="button" class="btn btn-link text-danger btn-sm text-decoration-none p-0" onclick="eliminaAccount()">Elimina account</button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-md-8 h-100 d-flex flex-column">
                <div class="bg-white p-4 rounded-3 shadow-sm d-flex flex-column h-100">
                    <h4 class="text-primary fw-bold mb-3 border-bottom pb-2">Storico Ordini</h4>
                    <div id="elenco-ordini-cliente" class="flex-grow-1 overflow-y-auto pe-2">
                        <p class="text-muted">Caricamento ordini...</p>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script src="js/profiloCliente-script.js"></script>
</body>
</html>
