<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - FastFood</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light vh-100 d-flex flex-column overflow-hidden">
    
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm flex-shrink-0">
        <div class="container-fluid px-4">
            <a class="navbar-brand fw-bold" href="index.html">← Torna alla Home</a>
        </div>
    </nav>

    <div class="d-flex align-items-center justify-content-center flex-grow-1 px-2">
        <div class="bg-white p-4 rounded-3 shadow-sm w-100" style="max-width: 400px;">
            
            <div class="text-center mb-4">
                <h2 class="text-primary fw-bold mb-1">FastFood 🍔</h2>
                <p class="text-muted small mb-0">Accedi a un account esistente</p>
            </div>

            <form id="loginForm">
                <div class="mb-3">
                    <label class="form-label small text-muted">Seleziona il tuo ruolo</label>
                    <select class="form-select border-primary bg-primary bg-opacity-10 fw-bold" id="ruoloInput">
                        <option value="cliente" selected>Cliente</option>
                        <option value="ristoratore">Ristoratore</option>
                    </select>
                </div>

                <div class="mb-3">
                    <input type="email" class="form-control p-2" id="emailInput" placeholder="Indirizzo Email" required>
                </div>
                
                <div class="mb-4">
                    <input type="password" class="form-control p-2" id="passwordInput" placeholder="Password" required>
                </div>

                <div id="messaggioErrore" class="alert alert-danger d-none small p-2 text-center"></div>
                
                <button type="submit" class="btn btn-primary w-100 mb-3 fw-bold py-2" id="btnLogin">Accedi Ora</button>
                
                <div class="text-center small">
                    <p class="mb-0 text-muted">Non hai un account? <a href="register.html" class="text-decoration-none text-primary fw-bold">Registrati</a></p>
                </div>
            </form>

        </div>
    </div>
    
    <script src="js/login-script.js"></script>
</body>
</html>
