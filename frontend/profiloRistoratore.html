<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Il Mio Profilo - Aziendale</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light vh-100 d-flex flex-column overflow-hidden">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm flex-shrink-0">
        <div class="container-fluid px-4 d-flex justify-content-between align-items-center">
            <div class="d-flex align-items-center">
                <a class="navbar-brand fw-bold" href="ristoratore.html">← Torna all'Area gestione</a>
            </div>
            <button class="btn btn-danger" onclick="logout()">Esci</button>
        </div>
    </nav>

    <div class="container-fluid px-4 mt-4 flex-grow-1 d-flex flex-column overflow-hidden">
        <div class="row h-100 pb-4 justify-content-center">
            
            <div class="col-md-6 h-100 d-flex flex-column mb-3 mb-md-0">
                <div class="bg-white p-4 rounded-3 shadow-sm d-flex flex-column h-100 position-relative">
                    <h4 class="text-primary fw-bold mb-3 border-bottom pb-2" id="displayEmail">I Miei Dati</h4>

                    <div class="flex-grow-1 d-flex flex-column overflow-y-auto">
                        <form id="profileForm" class="d-flex flex-column h-100 pe-2">
                                          
                            <div class="row g-3 mb-3">
                                <div class="col-6">
                                    <label class="form-label small text-muted mb-0">Nome Titolare</label>
                                    <input type="text" id="profNome" class="form-control">
                                </div>
                                <div class="col-6">
                                    <label class="form-label small text-muted mb-0">Cognome Titolare</label>
                                    <input type="text" id="profCognome" class="form-control">
                                </div>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label small text-muted mb-0">Nuova Password</label>
                                <input type="password" id="profPassword" class="form-control" placeholder="Vuoto per non cambiare">
                            </div>

                            <h6 class="text-primary fw-bold border-bottom pb-2 mb-3 mt-4">Dati Aziendali</h6>
                            
                            <div class="mb-3">
                                <label class="form-label small text-muted mb-0">Nome Ristorante</label>
                                <input type="text" id="profNomeRistorante" class="form-control">
                            </div>
                            <div class="row g-3 mb-3">
                                <div class="col-6">
                                    <label class="form-label small text-muted mb-0">Telefono</label>
                                    <input type="text" id="profTelefono" class="form-control">
                                </div>
                                <div class="col-6">
                                    <label class="form-label small text-muted mb-0">Partita IVA</label>
                                    <input type="text" id="profPiva" class="form-control">
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label small text-muted mb-0">Sede Aziendale</label>
                                <input type="text" id="profSede" class="form-control">
                            </div>

                            <div class="mt-auto pt-4 border-top">
                                <button type="submit" class="btn btn-primary w-100 fw-bold mb-2 py-2">Salva Modifiche</button>
                                <div class="text-center">
                                    <button type="button" class="btn btn-link text-danger btn-sm text-decoration-none p-0" onclick="eliminaAccount()">Elimina account e ristorante</button>
                                </div>
                            </div>
                        </form>
                    </div>

                </div>
            </div>

        </div>
    </div>

    <script src="js/profiloRistoratore-script.js"></script>
</body>
</html>
