<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Area Ristoratore - FastFood</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light vh-100 d-flex flex-column overflow-hidden">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm flex-shrink-0">
        <div class="container-fluid px-4 d-flex justify-content-between align-items-center">
            <div class="d-flex align-items-center">
                <span class="navbar-brand fw-bold" href="#">Area gestione ristorante</span>
            </div>
            <div class="d-flex gap-2">
                <a class="btn btn-primary" href="profilo.html">👤 Profilo</a>
                <button class="btn btn-outline-danger ms-2" onclick="logout()">Esci</button>
            </div>
        </div>
    </nav>

    <div class="container-fluid px-4 mt-3 flex-grow-1 d-flex flex-column overflow-hidden">
        
        <ul class="nav nav-tabs mb-3 flex-shrink-0" id="ristoratoreTabs" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active fw-bold text-primary" data-bs-toggle="tab" data-bs-target="#ordini" type="button">🛎️ Ordini</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link fw-bold text-primary" data-bs-toggle="tab" data-bs-target="#menu" type="button">🍔 Menù</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link fw-bold text-primary" data-bs-toggle="tab" data-bs-target="#stats" type="button">📊 Statistiche</button>
            </li>
        </ul>

        <div class="tab-content flex-grow-1 overflow-y-auto pb-4 pe-2" id="ristoratoreTabsContent">
            
            <div class="tab-pane fade show active h-100" id="ordini" role="tabpanel">
                <div class="card shadow-sm border-0 h-100 d-flex flex-column">
                    <div class="card-body p-0 flex-grow-1 overflow-y-auto">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light sticky-top">
                                <tr>
                                    <th class="ps-3">ID</th>
                                    <th>Cliente</th>
                                    <th>Piatti</th>
                                    <th>Totale</th>
                                    <th>Modalità</th>
                                    <th>Stato</th>
                                    <th class="pe-3">Azioni</th>
                                </tr>
                            </thead>
                            <tbody id="tabella-ordini-ristorante">
                                <tr><td colspan="7" class="text-center text-muted py-4">Caricamento ordini in corso...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div class="tab-pane fade" id="menu" role="tabpanel">
                
                <div class="card shadow-sm border-0 mb-4" style="max-width: 750px; margin: 0 auto;">
                    <div class="card-body">
                        <h5 class="mb-3 text-primary fw-bold border-bottom pb-2">Aggiungi Nuovo Piatto</h5>
                        <form id="formMenu" class="row g-3 mb-2">
                            <div class="col-12">
                                <label class="form-label small text-muted">Seleziona dalla lista comune</label>
                                <select id="selectPiattoComune" class="form-select border-primary bg-primary bg-opacity-10">
                                    <option value="">-- Creazione piatto personalizzato vuoto --</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label small text-muted">Nome</label>
                                <input type="text" id="piattoNome" class="form-control" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label small text-muted">Tipologia</label>
                                <input type="text" id="piattoTipo" class="form-control" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label small text-muted">Prezzo (€)</label>
                                <input type="number" step="0.01" id="piattoPrezzo" class="form-control" required>
                            </div>
                            <div class="col-md-12">
                                <label class="form-label small text-muted">URL Foto</label>
                                <input type="text" id="piattoFoto" class="form-control" required>
                            </div>
                            <div class="col-12">
                                <label class="form-label small text-muted">Ingredienti (separati da virgola)</label>
                                <textarea id="piattoIngredienti" class="form-control" rows="2" required></textarea>
                            </div>
                            <div class="col-12">
                                <button type="submit" class="btn btn-primary fw-bold">➕ Aggiungi al Menu</button>
                            </div>
                        </form>
                    </div>
                </div>

                <h5 class="mb-3 text-primary fw-bold border-bottom pb-2 mt-4">Il tuo Menu Attuale</h5>
                <div class="row g-3" id="grigliaMenuRistorante"></div>
            </div>


            <div class="tab-pane fade" id="stats" role="tabpanel">
                <div class="card shadow-sm border-0">
                    <div class="card-body text-center p-5">
                        <h4 class="mb-4 text-primary fw-bold">Riepilogo Vendite Completate</h4>
                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <div class="p-4 bg-light rounded-3 shadow-sm border">
                                    <h6 class="text-muted text-uppercase mb-2">Ordini Evaso</h6>
                                    <h2 id="statOrdini" class="fw-bold text-primary mb-0">0</h2>
                                </div>
                            </div>
                            <div class="col-md-4 mb-3">
                                <div class="p-4 bg-light rounded-3 shadow-sm border">
                                    <h6 class="text-muted text-uppercase mb-2">Incasso Totale</h6>
                                    <h2 id="statIncasso" class="fw-bold text-primary mb-0">€0.00</h2>
                                </div>
                            </div>
                            <div class="col-md-4 mb-3">
                                <div class="p-4 bg-light rounded-3 shadow-sm border">
                                    <h6 class="text-muted text-uppercase mb-2">Piatto Più Venduto</h6>
                                    <h4 id="statPiatto" class="fw-bold text-primary mb-0">-</h4>
                                    <small id="statPiattoQta" class="text-muted fw-bold"></small>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/ristoratore-script.js"></script>
</body>
</html>
