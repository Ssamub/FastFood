<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FastFood - Home</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f8f9fa; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #adb5bd; border-radius: 4px; }
    </style>
</head>
<body class="bg-light vh-100 d-flex flex-column overflow-hidden">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm flex-shrink-0">
        <div class="container-fluid px-4">
            <a class="navbar-brand fw-bold" href="index.html">FastFood 🍔</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item me-3 mb-2 mb-lg-0">
                        <a class="btn btn-outline-warning d-flex align-items-center" href="carrello.html">
                            🛒 Carrello <span id="contatore-carrello" class="badge bg-danger ms-2">0</span>
                        </a>
                    </li>
                    <li class="nav-item d-flex gap-2" id="auth-buttons-container"></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container-fluid px-4 mt-4 d-flex flex-column flex-grow-1 overflow-hidden">
        
        <div id="sezione-ricerca" class="flex-shrink-0">
            <h2 class="mb-3 text-primary fw-bold" id="titolo-pagina">Ristoranti Disponibili</h2>
            <div class="row mb-3">
                <div class="col-md-8 mb-2">
                    <input type="text" id="cerca-input" class="form-control" placeholder="Cerca un ristorante per nome o luogo...">
                </div>
                <div class="col-md-4 mb-2 d-none" id="cerca-prezzo-container">
                    <input type="number" id="cerca-prezzo" class="form-control border-primary" placeholder="Prezzo massimo (€)" step="0.50" min="0">
                </div>
            </div>
            <div id="pulsante-torna-container" class="mb-3 d-none">
                <button class="btn btn-secondary btn-sm" id="btn-torna">← Torna ai Ristoranti</button>
            </div>
        </div>

        <div class="flex-grow-1 overflow-y-auto pb-5">
            <div id="area-consigliati"></div>
            <div id="griglia-principale" class="row align-content-start">
                <div class="col-12 text-center text-muted"><p>Caricamento in corso...</p></div>
            </div>
        </div>
        
    </div>

    <script src="js/script.js"></script>
</body>
</html>
