<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Ristorante</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light vh-100 d-flex flex-column overflow-hidden">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm flex-shrink-0">
        <div class="container-fluid px-4">
            
            <div class="d-flex align-items-center">
                <a class="navbar-brand fw-bold me-0" href="index.html">← Torna ai Ristoranti</a>
                <span class="navbar-text text-white fw-bold d-none d-sm-inline ms-2" id="nav-nome-ristorante"></span>
            </div>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item d-flex gap-2" id="auth-buttons-container"></li>
                </ul>
            </div>
            
        </div>
    </nav>

    <div class="container-fluid px-4 mt-4 d-flex flex-column flex-grow-1 overflow-hidden">
        
        <div class="flex-shrink-0">
            <h2 class="mb-3 text-primary fw-bold" id="titolo-menu">Menu in caricamento...</h2>
            <div class="row mb-3">
                <div class="col-md-8 mb-2">
                    <input type="text" id="cerca-piatto" class="form-control" placeholder="Cerca un piatto per nome o tipologia...">
                </div>
                <div class="col-md-4 mb-2">
                    <input type="number" id="cerca-prezzo" class="form-control border-primary" placeholder="Prezzo massimo (€)" step="0.50" min="0">
                </div>
            </div>
        </div>

        <div class="flex-grow-1 overflow-y-auto overflow-x-hidden pb-5 px-2">
            <div id="griglia-menu" class="row align-content-start">
                </div>
        </div>
        
    </div>

    <script src="js/menu-script.js"></script>
</body>
</html>
