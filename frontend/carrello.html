<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrello - FastFood</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light vh-100 d-flex flex-column overflow-hidden">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm flex-shrink-0">
        <div class="container-fluid px-4 d-flex justify-content-between align-items-center">
            <div class="d-flex align-items-center">
                <a class="navbar-brand fw-bold" href="index.html">← Torna alla Home</a>
            </div>
            <div class="d-flex gap-2">
                <a class="btn btn-success ms-2 d-flex align-items-center" href="ordini.html">Ordini</a>
                <a class="btn btn-primary ms-2 d-flex align-items-center" href="profilo.html">Profilo</a>
            </div>
        </div>
    </nav>

    <div class="container-fluid px-4 mt-4 flex-grow-1 d-flex flex-column overflow-hidden">
        <div class="row h-100 pb-4">
            
            <div class="col-md-8 h-100 d-flex flex-column mb-3 mb-md-0">
                <div class="bg-white p-3 rounded-3 shadow-sm flex-grow-1 overflow-y-auto" id="lista-carrello">
                    </div>
            </div>
            
            <div class="col-md-4 h-100">
                <div class="card shadow-sm border-0 h-100">
                    <div class="card-header bg-primary text-white fw-bold py-3">Riepilogo e Pagamento</div>
                    <div class="card-body d-flex flex-column">
                        <h3 class="mb-4 text-center">Totale: <span id="totale-carrello" class="text-primary fw-bold">€0.00</span></h3>
                        <form id="formCheckout" class="flex-grow-1 d-flex flex-column">
                            <div class="mb-3">
                                <label class="form-label small text-muted">Modalità di ricezione</label>
                                <select class="form-select border-primary" id="modalitaOrdine" required>
                                    <option value="ritiro">Ritiro presso il Ristorante</option>
                                    <option value="domicilio">Consegna a Domicilio</option>
                                </select>
                            </div>
                            <div class="mb-3 d-none" id="box-indirizzo">
                                <label class="form-label small text-muted">Indirizzo di Consegna</label>
                                <input type="text" class="form-control" id="indirizzoConsegna">
                            </div>
                            
                            <div class="mt-3 mb-4 p-3 bg-light border rounded">
                                <h6 class="text-primary fw-bold mb-3">Dati di Pagamento 💳</h6>
                                <div class="mb-2">
                                    <input type="text" class="form-control form-control-sm" id="numCarta" placeholder="Numero Carta (16 cifre)" title="Inserisci esattamente 16 numeri" required>
                                </div>
                                <div class="row g-2">
                                    <div class="col-6">
                                        <input type="text" class="form-control form-control-sm" id="scadCarta" placeholder="Scadenza (MM/AA)" title="Inserisci una data valida nel formato MM/AA" required>
                                    </div>
                                    <div class="col-6">
                                        <input type="text" class="form-control form-control-sm" id="cvvCarta" placeholder="CVV (3 cifre)" title="Inserisci il codice a 3 cifre sul retro" required>
                                    </div>
                                </div>
                            </div>
                            <div class="mt-auto">
                                <div id="msgCheckout" class="alert d-none small p-2 text-center"></div>
                                <button type="submit" class="btn btn-primary w-100 fw-bold py-2" id="btnConferma">Conferma Ordine</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

        </div>
    </div>
    <script src="js/carrello-script.js"></script>
</body>
</html>
