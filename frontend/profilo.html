<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Il Mio Profilo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light vh-100 d-flex flex-column overflow-hidden">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm flex-shrink-0">
        <div class="container-fluid px-4 d-flex justify-content-between align-items-center">
            <div class="d-flex align-items-center">
                <a class="navbar-brand fw-bold" href="index.html" id="link-indietro">← Torna alla Home</a>
            </div>
            <div class="d-flex gap-2" id="nav-actions">
                <button class="btn btn-danger" onclick="logout()">Esci</button>
            </div>
        </div>
    </nav>

    <div class="container-fluid px-4 mt-4 flex-grow-1 d-flex flex-column overflow-hidden">
        <div class="row h-100 pb-4 justify-content-center">
            
            <div class="col-md-6 h-100 d-flex flex-column mb-3 mb-md-0">
                <div class="bg-white p-4 rounded-3 shadow-sm d-flex flex-column h-100 position-relative">
                    <h4 class="text-primary fw-bold mb-3 border-bottom pb-2">
                        I miei dati:
                        <span id="displayEmail" class="text-dark fw-bold medium"></span>
                    </h4>

                    <div class="flex-grow-1 d-flex flex-column overflow-y-auto">
                        <form id="profileForm" class="d-flex flex-column h-100 pe-2">
                                          
                            <div id="sezione-cliente" class="d-none">
                                <div class="row g-3 mb-3">
                                    <div class="col-6">
                                        <label class="form-label small text-muted mb-0">Nome</label>
                                        <input type="text" id="cliNome" class="form-control">
                                    </div>
                                    <div class="col-6">
                                        <label class="form-label small text-muted mb-0">Cognome</label>
                                        <input type="text" id="cliCognome" class="form-control">
                                    </div>
                                </div>
                                
                                <div class="row g-3 mb-3">
                                    <div class="col-6">
                                        <label class="form-label small text-muted mb-0">Nome Utente</label>
                                        <input type="text" id="cliUsername" class="form-control">
                                    </div>
                                    <div class="col-6">
                                        <label class="form-label small text-muted mb-0">Nuova Password</label>
                                        <input type="password" id="cliPassword" class="form-control" placeholder="Vuoto per non cambiare">
                                    </div>
                                </div>
                                
                                <div class="mb-3">
                                    <label class="form-label small text-muted mb-0">Indirizzo di spedizione</label>
                                    <input type="text" id="cliIndirizzo" class="form-control">
                                </div>
                                <div class="row g-3 mb-3">
                                    <div class="col-6">
                                        <label class="form-label small text-muted mb-0">Pagamento Preferito</label>
                                        <select class="form-select" id="cliPagamento">
                                            <option value="carta_credito">Carta di Credito</option>
                                            <option value="prepagata">Carta Prepagata</option>
                                        </select>
                                    </div>
                                    <div class="col-6">
                                        <label class="form-label small text-muted mb-0">Preferenze</label>
                                        <input type="text" id="cliPreferenze" class="form-control" placeholder="Es. Fritto, Dolce...">
                                    </div>
                                </div>

                                <div class="mt-2 mb-4 p-3 bg-light border rounded">
                                    <h6 class="mb-3">Carta Salvata</h6>
                                    <div class="mb-2">
                                        <input type="text" class="form-control form-control-sm" id="cliNumCarta" placeholder="Numero Carta (16 cifre)" pattern="\d{16}" title="Inserisci esattamente 16 numeri">
                                    </div>
                                    <div class="row g-2">
                                        <div class="col-6">
                                            <input type="text" class="form-control form-control-sm" id="cliScadCarta" placeholder="Scadenza (MM/AA)" pattern="(0[1-9]|1[0-2])\/[0-9]{2}" title="Inserisci una data valida nel formato MM/AA">
                                        </div>
                                        <div class="col-6">
                                            <input type="text" class="form-control form-control-sm" id="cliCvvCarta" placeholder="CVV (3 cifre)" pattern="\d{3}" title="Inserisci il codice a 3 cifre sul retro">
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div id="sezione-ristoratore" class="d-none">
                                <div class="row g-3 mb-3">
                                    <div class="col-6">
                                        <label class="form-label small text-muted mb-0">Nome Titolare</label>
                                        <input type="text" id="ristNome" class="form-control">
                                    </div>
                                    <div class="col-6">
                                        <label class="form-label small text-muted mb-0">Cognome Titolare</label>
                                        <input type="text" id="ristCognome" class="form-control">
                                    </div>
                                </div>
                                
                                <div class="mb-3">
                                    <label class="form-label small text-muted mb-0">Nuova Password</label>
                                    <input type="password" id="ristPassword" class="form-control" placeholder="Vuoto per non cambiare">
                                </div>
                                
                                <div class="mb-3">
                                    <label class="form-label small text-muted mb-0">Nome Ristorante</label>
                                    <input type="text" id="ristNomeRistorante" class="form-control">
                                </div>
                                <div class="row g-3 mb-3">
                                    <div class="col-6">
                                        <label class="form-label small text-muted mb-0">Telefono</label>
                                        <input type="text" id="ristTelefono" class="form-control">
                                    </div>
                                    <div class="col-6">
                                        <label class="form-label small text-muted mb-0">Partita IVA</label>
                                        <input type="text" id="ristPiva" class="form-control">
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label small text-muted mb-0">Sede Aziendale</label>
                                    <input type="text" id="ristSede" class="form-control">
                                </div>
                            </div>

                            <div class="mt-auto pt-4 border-top">
                                <button type="submit" class="btn btn-primary w-100 fw-bold mb-2 py-2">Salva Modifiche</button>
                                <div class="text-center">
                                    <button type="button" class="btn btn-link text-danger btn-sm text-decoration-none p-0" onclick="eliminaAccount()">Elimina account</button>
                                </div>
                            </div>
                        </form>
                    </div>

                </div>
            </div>

        </div>
    </div>

    <script src="js/profilo-script.js"></script>
</body>
</html>
