<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Il Mio Profilo - FastFood</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light vh-100 d-flex flex-column overflow-hidden">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm flex-shrink-0">
        <div class="container-fluid px-4 d-flex justify-content-between align-items-center">
            <div class="d-flex align-items-center">
                <a class="navbar-brand fw-bold" id="link-torna-profilo" href="index.html">← Torna al Menu</a>
                <span class="navbar-text text-white fw-bold d-none d-sm-inline ms-2">| Il Mio Profilo 👤</span>
            </div>
            <button class="btn btn-outline-danger" onclick="logout()">Esci</button>
        </div>
    </nav>

    <div class="container-fluid px-4 mt-4 flex-grow-1 d-flex flex-column overflow-hidden">
        <div class="row h-100 pb-4">
            
            <div id="col-dati" class="col-md-4 h-100 d-flex flex-column mb-3 mb-md-0">
                <div class="bg-white p-4 rounded-3 shadow-sm d-flex flex-column h-100 position-relative">
                    <h4 class="text-primary fw-bold mb-3 border-bottom pb-2">I Miei Dati</h4>
                    
                    <div id="profMessaggio" class="alert d-none small text-center position-absolute top-0 end-0 m-3 shadow-sm" style="z-index: 100; max-width: 55%;"></div>

                    <div class="flex-grow-1 overflow-y-auto pe-2">
                        <form id="profileForm">
                            <div class="row g-2 mb-2">
                                <div class="col-6">
                                    <label class="form-label small text-muted">Nome</label>
                                    <input type="text" id="profNome" class="form-control form-control-sm">
                                </div>
                                <div class="col-6">
                                    <label class="form-label small text-muted">Cognome</label>
                                    <input type="text" id="profCognome" class="form-control form-control-sm">
                                </div>
                            </div>
                            
                            <div class="mb-2" id="wrapper-username">
                                <label class="form-label small text-muted">Nome Utente</label>
                                <input type="text" id="profUsername" class="form-control form-control-sm">
                            </div>

                            <div class="mb-2">
                                <label class="form-label small text-muted">Email</label>
                                <input type="email" id="profEmail" class="form-control form-control-sm bg-light" disabled>
                            </div>

                            <div class="mb-3">
                                <label class="form-label small text-muted">Nuova Password (lascia vuoto per non cambiare)</label>
                                <input type="password" id="profPassword" class="form-control form-control-sm" placeholder="******">
                            </div>
                            
                            <div id="sezione-campi-cliente">
                                <div class="mb-2" id="wrapper-indirizzo">
                                    <label class="form-label small text-muted">Indirizzo di spedizione</label>
                                    <input type="text" id="profIndirizzo" class="form-control form-control-sm">
                                </div>
                                <div class="mb-2" id="wrapper-pagamento">
                                    <label class="form-label small text-muted">Metodo di Pagamento</label>
                                    <select class="form-select form-select-sm" id="profPagamento">
                                        <option value="carta_credito">Carta di Credito</option>
                                        <option value="prepagata">Carta Prepagata</option>
                                    </select>
                                </div>
                                <div class="mb-2" id="wrapper-preferenze">
                                    <label class="form-label small text-muted">Preferenze</label>
                                    <input type="text" id="profPreferenze" class="form-control form-control-sm">
                                </div>
                            </div>

                            <div id="sezione-campi-ristoratore" class="d-none">
                                <h5 class="text-primary fw-bold mb-3 border-bottom pb-2 mt-4">Dati Aziendali</h5>
                                <div class="mb-2">
                                    <label class="form-label small text-muted">Nome Ristorante</label>
                                    <input type="text" id="profNomeRistorante" class="form-control form-control-sm">
                                </div>
                                <div class="mb-2">
                                    <label class="form-label small text-muted">Telefono</label>
                                    <input type="text" id="profTelefono" class="form-control form-control-sm">
                                </div>
                                <div class="mb-2">
                                    <label class="form-label small text-muted">Partita IVA</label>
                                    <input type="text" id="profPiva" class="form-control form-control-sm">
                                </div>
                                <div class="mb-2">
                                    <label class="form-label small text-muted">Indirizzo Sede Aziendale</label>
                                    <input type="text" id="profSede" class="form-control form-control-sm">
                                </div>
                            </div>

                            <div class="d-grid gap-2 mt-4" id="areaAzioniProfilo">
                                <button type="submit" class="btn btn-primary fw-bold">Salva Modifiche</button>
                                <button type="button" class="btn btn-link text-danger btn-sm text-decoration-none mt-1" onclick="mostraConfermaElimina()">Elimina account</button>
                            </div>
                        </form>
                    </div>

                    <div id="areaConfermaElimina" class="d-none position-absolute top-0 start-0 w-100 h-100 bg-white bg-opacity-75 d-flex justify-content-center align-items-center p-4 rounded-3" style="z-index: 20;">
                        <div class="bg-white p-4 rounded-3 shadow border border-danger text-center w-100">
                            <p class="text-danger mb-3 fw-bold">Sei sicuro di voler eliminare il profilo?</p>
                            <div class="d-flex gap-2">
                                <button type="button" class="btn btn-danger btn-sm w-100 fw-bold" onclick="confermaEliminazioneDefinitiva()">Sì, elimina</button>
                                <button type="button" class="btn btn-light btn-sm w-100 border fw-bold" onclick="annullaEliminazione()">Annulla</button>
                            </div>
                        </div>
                    </div>

                </div>
            </div>

            <div id="col-ordini" class="col-md-8 h-100 d-flex flex-column">
                <div class="bg-white p-4 rounded-3 shadow-sm d-flex flex-column h-100">
                    <h4 class="text-primary fw-bold mb-3 border-bottom pb-2">Storico Ordini</h4>
                    <div id="elenco-ordini-cliente" class="flex-grow-1 overflow-y-auto pe-2">
                        <p class="text-muted">Caricamento ordini...</p>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script src="js/profile-script.js"></script>
</body>
</html>
